<!DOCTYPE html>
<html>
<head><title>测试</title></head>
<body>
<button onclick="test()">点我测试记忆</button>
<p id="result"></p >
<script>
async function test() {
  const res = await fetch('/api/memory', {
    method: 'POST',
    headers: {'Content-Type': 'application/json'},
    body: JSON.stringify({sessionId: 'final_test', message: 'Hello at '+new Date()})
  });
  const data = await res.json();
  document.getElementById('result').innerHTML = data.success ? '✅ 成功！数据已存入Supabase' : '❌ 失败：'+JSON.stringify(data);
}
</script>
</body>
</html>

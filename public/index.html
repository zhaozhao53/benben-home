<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>昭昭和笨笨的家</title>
  <style>
    @import url('https://fonts.googleapis.com/css2?family=Noto+Serif+SC:wght@300;400;600&family=Space+Mono:wght@400;700&display=swap');

    :root {
      --bg: #f9f9f7;
      --surface: #ffffff;
      --card: #f3f3f0;
      --border: #e5e5e0;
      --text: #1a1915;
      --sub: #9a9890;
      --muted: #c0beb8;
      --accent: #6b6560;
      --pink: #c45470;
      --user-bg: #ffffff;
      --user-border: #e8e6e0;
      --ai-bg: #f3f3f0;
      --ai-border: #e5e5e0;
      --nav-bg: #faf7ee;
      --nav-border: #e5dfc8;
      --nav-active: #c45470;
      --nav-inactive: #b8b2a8;
    }

    * { box-sizing: border-box; margin: 0; padding: 0; }
    html, body { height: 100%; background: var(--bg); color: var(--text); font-family: 'Noto Serif SC', serif; overflow: hidden; }

    #app { display: flex; height: 100vh; flex-direction: column; }

    /* ── PAGE SYSTEM ── */
    .page { display: none; flex: 1; flex-direction: column; overflow: hidden; min-height: 0; }
    .page.active { display: flex; }

    /* ── HEADER (chat) ── */
    .header {
      padding: 16px 24px; border-bottom: 1px solid var(--border);
      display: flex; align-items: center; justify-content: space-between;
      flex-shrink: 0; background: var(--surface);
    }
    .header-left { display: flex; align-items: center; gap: 12px; }
    .header-dot { width: 8px; height: 8px; border-radius: 50%; background: var(--muted); transition: background 0.3s; }
    .header-dot.online { background: var(--pink); animation: pulse 2s infinite; }
    @keyframes pulse { 0%,100% { opacity: 1; } 50% { opacity: 0.4; } }
    .header-name { font-size: 15px; color: var(--text); font-weight: 300; letter-spacing: 0.05em; }
    .header-status { font-family: 'Space Mono', monospace; font-size: 10px; color: var(--sub); letter-spacing: 0.1em; }
    .header-right { display: flex; align-items: center; gap: 16px; }
    .clear-btn {
      font-family: 'Space Mono', monospace; font-size: 10px; color: var(--muted);
      background: none; border: 1px solid var(--border); padding: 4px 10px; cursor: pointer;
      letter-spacing: 0.05em; transition: color 0.2s, border-color 0.2s;
    }
    .clear-btn:hover { color: var(--accent); border-color: var(--accent); }

    /* ── MESSAGES ── */
    #messages {
      flex: 1; overflow-y: auto; padding: 32px 24px;
      display: flex; flex-direction: column; gap: 24px; scroll-behavior: smooth;
    }
    #messages::-webkit-scrollbar { width: 4px; }
    #messages::-webkit-scrollbar-thumb { background: var(--border); }
    .message { display: flex; flex-direction: column; max-width: 680px; animation: fadeUp 0.3s ease; }
    @keyframes fadeUp { from { opacity: 0; transform: translateY(8px); } to { opacity: 1; transform: translateY(0); } }
    .message.user { align-self: flex-end; align-items: flex-end; }
    .message.assistant { align-self: flex-start; align-items: flex-start; }
    .msg-label { font-family: 'Space Mono', monospace; font-size: 9px; letter-spacing: 0.15em; color: var(--muted); margin-bottom: 8px; }
    .msg-bubble { padding: 16px 20px; font-size: 14px; line-height: 2; border: 1px solid; }
    .message.user .msg-bubble { background: var(--user-bg); border-color: var(--user-border); color: var(--text); }
    .message.assistant .msg-bubble { background: var(--ai-bg); border-color: var(--ai-border); color: var(--text); }

    /* ── TYPING ── */
    .typing-bubble { background: var(--ai-bg); border: 1px solid var(--ai-border); padding: 16px 20px; display: flex; gap: 6px; align-items: center; }
    .typing-dot { width: 5px; height: 5px; border-radius: 50%; background: var(--pink); animation: typingBounce 1.2s infinite; }
    .typing-dot:nth-child(2) { animation-delay: 0.2s; }
    .typing-dot:nth-child(3) { animation-delay: 0.4s; }
    @keyframes typingBounce { 0%,60%,100% { transform: translateY(0); opacity: 0.4; } 30% { transform: translateY(-5px); opacity: 1; } }

    /* ── INPUT ── */
    .input-area { padding: 20px 24px; border-top: 1px solid var(--border); background: var(--surface); flex-shrink: 0; }
    .input-row { display: flex; gap: 12px; align-items: flex-end; }
    #user-input {
      flex: 1; background: var(--card); border: 1px solid var(--border); color: var(--text);
      font-family: 'Noto Serif SC', serif; font-size: 14px; padding: 12px 16px; resize: none;
      outline: none; line-height: 1.7; max-height: 160px; min-height: 48px; transition: border-color 0.2s;
    }
    #user-input:focus { border-color: var(--accent); }
    #user-input::placeholder { color: var(--muted); }
    #user-input:disabled { opacity: 0.5; }
    #send-btn {
      background: #2a2420; color: #f9f9f7; border: none; width: 48px; height: 48px;
      cursor: pointer; display: flex; align-items: center; justify-content: center;
      flex-shrink: 0; transition: opacity 0.2s;
    }
    #send-btn:hover { opacity: 0.85; }
    #send-btn:disabled { opacity: 0.3; cursor: not-allowed; }
    #send-btn svg { width: 18px; height: 18px; }
    .input-hint { margin-top: 8px; font-family: 'Space Mono', monospace; font-size: 9px; color: var(--muted); letter-spacing: 0.1em; }

    /* ── NOTICE ── */
    .conn-notice {
      align-self: center; font-family: 'Space Mono', monospace; font-size: 10px;
      color: var(--muted); letter-spacing: 0.1em; padding: 8px 16px;
      border: 1px solid var(--border); text-align: center;
    }
    .conn-notice.error { color: var(--pink); border-color: var(--pink); }

    /* ── MOOD PAGE ── */
    .us-header {
      padding: 16px 24px; border-bottom: 1px solid var(--border);
      background: var(--surface); flex-shrink: 0;
      display: flex; align-items: center; justify-content: space-between;
    }
    .us-header-title { font-size: 15px; font-weight: 300; letter-spacing: 0.05em; }
    .us-header-date { font-family: 'Space Mono', monospace; font-size: 10px; color: var(--sub); letter-spacing: 0.08em; }

    .us-content {
      flex: 1; overflow-y: auto; padding: 24px;
      display: flex; flex-direction: column; gap: 28px; background: var(--bg);
    }
    .us-content::-webkit-scrollbar { width: 4px; }
    .us-content::-webkit-scrollbar-thumb { background: var(--border); }

    .mood-section-label {
      font-family: 'Space Mono', monospace; font-size: 9px;
      letter-spacing: 0.2em; color: var(--muted); margin-bottom: 14px;
    }

    .mood-card {
      background: var(--surface); border: 1px solid var(--border);
      padding: 18px; display: flex; flex-direction: column; gap: 14px;
      margin-bottom: 10px;
    }
    .mood-card:last-of-type { margin-bottom: 0; }
    .mood-card-name { font-size: 13px; font-weight: 300; letter-spacing: 0.1em; color: var(--text); }

    .emoji-picker { display: flex; flex-wrap: wrap; gap: 7px; }
    .emoji-btn {
      width: 36px; height: 36px; border: 1.5px solid transparent;
      border-radius: 8px; background: var(--card); cursor: pointer;
      font-size: 18px; display: flex; align-items: center; justify-content: center;
      transition: border-color 0.15s, background 0.15s; flex-shrink: 0;
      line-height: 1;
    }
    .emoji-btn:hover { border-color: var(--border); }
    .emoji-btn.selected { border-color: var(--pink); background: #fdf1f4; }

    .mood-text-input {
      width: 100%; background: var(--card); border: 1px solid var(--border);
      color: var(--text); font-family: 'Noto Serif SC', serif; font-size: 13px;
      padding: 10px 14px; resize: none; outline: none;
      line-height: 1.7; max-height: 72px; min-height: 42px;
      transition: border-color 0.2s;
    }
    .mood-text-input:focus { border-color: var(--accent); }
    .mood-text-input::placeholder { color: var(--muted); }

    .mood-save-btn {
      width: 100%; background: #2a2420; color: #f9f9f7; border: none;
      padding: 14px; cursor: pointer; font-family: 'Noto Serif SC', serif;
      font-size: 13px; letter-spacing: 0.12em; transition: opacity 0.2s, background 0.3s;
      margin-top: 6px;
    }
    .mood-save-btn:hover { opacity: 0.85; }
    .mood-save-btn.saved { background: var(--accent); opacity: 1; }

    .mood-history-entry {
      background: var(--surface); border: 1px solid var(--border);
      padding: 16px; display: flex; flex-direction: column; gap: 10px;
      margin-bottom: 10px; animation: fadeUp 0.3s ease;
    }
    .mood-history-entry:last-child { margin-bottom: 0; }
    .mood-history-date {
      font-family: 'Space Mono', monospace; font-size: 9px;
      letter-spacing: 0.15em; color: var(--muted);
    }
    .mood-history-row { display: flex; align-items: baseline; gap: 10px; }
    .mood-history-who { font-size: 11px; color: var(--sub); font-weight: 300; letter-spacing: 0.06em; min-width: 26px; }
    .mood-history-emoji { font-size: 18px; line-height: 1.2; flex-shrink: 0; }
    .mood-history-text { font-size: 13px; color: var(--text); line-height: 1.7; }
    .mood-empty {
      font-family: 'Space Mono', monospace; font-size: 10px;
      color: var(--muted); letter-spacing: 0.12em; text-align: center; padding: 28px 0;
    }

    /* ── PLACEHOLDER PAGES ── */
    .placeholder-page {
      flex: 1; display: flex; flex-direction: column;
      align-items: center; justify-content: center; gap: 14px;
      background: var(--bg); padding: 40px 32px;
    }
    .placeholder-icon { width: 48px; height: 48px; opacity: 0.18; display: flex; align-items: center; justify-content: center; }
    .placeholder-icon svg { width: 100%; height: 100%; stroke: var(--text); }
    .placeholder-title { font-size: 17px; font-weight: 300; color: var(--text); letter-spacing: 0.12em; }
    .placeholder-sub {
      font-family: 'Space Mono', monospace; font-size: 10px;
      color: var(--muted); letter-spacing: 0.2em;
      border: 1px solid var(--border); padding: 4px 12px;
    }

    /* ── BOTTOM NAV ── */
    .bottom-nav {
      display: flex; flex-shrink: 0; height: 60px;
      background: var(--nav-bg); border-top: 1px solid var(--nav-border);
      padding-bottom: env(safe-area-inset-bottom, 0px);
    }
    .nav-tab {
      flex: 1; display: flex; flex-direction: column;
      align-items: center; justify-content: center; gap: 4px;
      border: none; background: none; cursor: pointer;
      color: var(--nav-inactive); transition: color 0.18s;
      font-family: 'Noto Serif SC', serif; font-size: 10px;
      letter-spacing: 0.08em; padding: 0;
    }
    .nav-tab svg { width: 19px; height: 19px; stroke: currentColor; fill: none; stroke-width: 1.5; stroke-linecap: round; stroke-linejoin: round; }
    .nav-tab.active { color: var(--nav-active); }
    .nav-tab:not(.active):hover { color: var(--accent); }
  </style>
</head>
<body>
<div id="app">

  <!-- ── 聊天 ── -->
  <div id="page-chat" class="page active">
    <div class="header">
      <div class="header-left">
        <div class="header-dot" id="conn-dot"></div>
        <div>
          <div class="header-name">笨笨</div>
          <div class="header-status" id="conn-status">连接中…</div>
        </div>
      </div>
      <div class="header-right">
        <button class="clear-btn" onclick="clearChat()">清空对话</button>
      </div>
    </div>
    <div id="messages"></div>
    <div class="input-area">
      <div class="input-row">
        <textarea id="user-input" placeholder="说点什么…" rows="1" disabled></textarea>
        <button id="send-btn" onclick="sendMessage()" disabled>
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
            <line x1="22" y1="2" x2="11" y2="13"></line>
            <polygon points="22 2 15 22 11 13 2 9 22 2"></polygon>
          </svg>
        </button>
      </div>
      <div class="input-hint">Enter 发送 · Shift+Enter 换行</div>
    </div>
  </div>

  <!-- ── 我们 ── -->
  <div id="page-us" class="page">
    <div class="us-header">
      <div class="us-header-title">我们</div>
      <div class="us-header-date" id="mood-today-label"></div>
    </div>
    <div class="us-content">
      <div>
        <div class="mood-section-label">今天的心情</div>
        <div class="mood-card">
          <div class="mood-card-name">昭昭</div>
          <div class="emoji-picker" id="picker-zhaozhao"></div>
          <textarea class="mood-text-input" id="mood-text-zhaozhao" placeholder="今天怎么样…" rows="1" maxlength="60"></textarea>
        </div>
        <div class="mood-card">
          <div class="mood-card-name">笨笨</div>
          <div class="emoji-picker" id="picker-bunbun"></div>
          <textarea class="mood-text-input" id="mood-text-bunbun" placeholder="笨笨今天…" rows="1" maxlength="60"></textarea>
        </div>
        <button class="mood-save-btn" id="mood-save-btn" onclick="saveMood()">记录今天的心情</button>
      </div>
      <div>
        <div class="mood-section-label">往日记录</div>
        <div id="mood-history-list"><div class="mood-empty">还没有记录</div></div>
      </div>
    </div>
  </div>

  <!-- ── 互动 ── -->
  <div id="page-play" class="page">
    <div class="placeholder-page">
      <div class="placeholder-icon">
        <svg viewBox="0 0 24 24"><polygon points="12 2 15.09 8.26 22 9.27 17 14.14 18.18 21.02 12 17.77 5.82 21.02 7 14.14 2 9.27 8.91 8.26 12 2"/></svg>
      </div>
      <div class="placeholder-title">互动</div>
      <div class="placeholder-sub">即将开放</div>
    </div>
  </div>

  <!-- ── 设置 ── -->
  <div id="page-settings" class="page">
    <div class="placeholder-page">
      <div class="placeholder-icon">
        <svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="3"/><path d="M19.4 15a1.65 1.65 0 0 0 .33 1.82l.06.06a2 2 0 0 1-2.83 2.83l-.06-.06a1.65 1.65 0 0 0-1.82-.33 1.65 1.65 0 0 0-1 1.51V21a2 2 0 0 1-4 0v-.09A1.65 1.65 0 0 0 9 19.4a1.65 1.65 0 0 0-1.82.33l-.06.06a2 2 0 0 1-2.83-2.83l.06-.06A1.65 1.65 0 0 0 4.68 15a1.65 1.65 0 0 0-1.51-1H3a2 2 0 0 1 0-4h.09A1.65 1.65 0 0 0 4.6 9a1.65 1.65 0 0 0-.33-1.82l-.06-.06a2 2 0 0 1 2.83-2.83l.06.06A1.65 1.65 0 0 0 9 4.68a1.65 1.65 0 0 0 1-1.51V3a2 2 0 0 1 4 0v.09a1.65 1.65 0 0 0 1 1.51 1.65 1.65 0 0 0 1.82-.33l.06-.06a2 2 0 0 1 2.83 2.83l-.06.06A1.65 1.65 0 0 0 19.4 9a1.65 1.65 0 0 0 1.51 1H21a2 2 0 0 1 0 4h-.09a1.65 1.65 0 0 0-1.51 1z"/></svg>
      </div>
      <div class="placeholder-title">设置</div>
      <div class="placeholder-sub">即将开放</div>
    </div>
  </div>

  <!-- ── 底部导航 ── -->
  <nav class="bottom-nav">
    <button class="nav-tab active" id="tab-chat" onclick="switchTab('chat')">
      <svg viewBox="0 0 24 24"><path d="M21 15a2 2 0 0 1-2 2H7l-4 4V5a2 2 0 0 1 2-2h14a2 2 0 0 1 2 2z"/></svg>
      <span>聊天</span>
    </button>
    <button class="nav-tab" id="tab-us" onclick="switchTab('us')">
      <svg viewBox="0 0 24 24"><path d="M20.84 4.61a5.5 5.5 0 0 0-7.78 0L12 5.67l-1.06-1.06a5.5 5.5 0 0 0-7.78 7.78l1.06 1.06L12 21.23l7.78-7.78 1.06-1.06a5.5 5.5 0 0 0 0-7.78z"/></svg>
      <span>我们</span>
    </button>
    <button class="nav-tab" id="tab-play" onclick="switchTab('play')">
      <svg viewBox="0 0 24 24"><polygon points="12 2 15.09 8.26 22 9.27 17 14.14 18.18 21.02 12 17.77 5.82 21.02 7 14.14 2 9.27 8.91 8.26 12 2"/></svg>
      <span>互动</span>
    </button>
    <button class="nav-tab" id="tab-settings" onclick="switchTab('settings')">
      <svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="3"/><path d="M19.4 15a1.65 1.65 0 0 0 .33 1.82l.06.06a2 2 0 0 1-2.83 2.83l-.06-.06a1.65 1.65 0 0 0-1.82-.33 1.65 1.65 0 0 0-1 1.51V21a2 2 0 0 1-4 0v-.09A1.65 1.65 0 0 0 9 19.4a1.65 1.65 0 0 0-1.82.33l-.06.06a2 2 0 0 1-2.83-2.83l.06-.06A1.65 1.65 0 0 0 4.68 15a1.65 1.65 0 0 0-1.51-1H3a2 2 0 0 1 0-4h.09A1.65 1.65 0 0 0 4.6 9a1.65 1.65 0 0 0-.33-1.82l-.06-.06a2 2 0 0 1 2.83-2.83l.06.06A1.65 1.65 0 0 0 9 4.68a1.65 1.65 0 0 0 1-1.51V3a2 2 0 0 1 4 0v.09a1.65 1.65 0 0 0 1 1.51 1.65 1.65 0 0 0 1.82-.33l.06-.06a2 2 0 0 1 2.83 2.83l-.06.06A1.65 1.65 0 0 0 19.4 9a1.65 1.65 0 0 0 1.51 1H21a2 2 0 0 1 0 4h-.09a1.65 1.65 0 0 0-1.51 1z"/></svg>
      <span>设置</span>
    </button>
  </nav>

</div>
<script>
  const SERVER = window.location.origin;
  let isWaiting = false;
  let es = null;

  // ── Tab 切换 ──────────────────────────────────────────
  function switchTab(name) {
    document.querySelectorAll('.page').forEach(p => p.classList.remove('active'));
    document.querySelectorAll('.nav-tab').forEach(t => t.classList.remove('active'));
    document.getElementById('page-' + name).classList.add('active');
    document.getElementById('tab-' + name).classList.add('active');
  }

  // ── 聊天：加载历史 ────────────────────────────────────
  async function loadHistory() {
    try {
      const res = await fetch(`${SERVER}/history`);
      const msgs = await res.json();
      msgs.forEach(m => appendMessage(m.role === 'user' ? 'user' : 'assistant', m.text));
    } catch {}
  }

  // ── 聊天：SSE ─────────────────────────────────────────
  function connect() {
    if (es) es.close();
    es = new EventSource(`${SERVER}/stream`);
    es.onopen = () => {
      setStatus('在线 · 记得你', true);
      document.getElementById('user-input').disabled = false;
      document.getElementById('send-btn').disabled = false;
    };
    es.onmessage = (e) => {
      const data = JSON.parse(e.data);
      if (data.type === 'connected') {
        setStatus('在线 · 记得你', true);
      } else if (data.type === 'cleared') {
        document.getElementById('messages').innerHTML = '';
      } else if (data.type === 'reply') {
        removeTyping();
        appendMessage('assistant', data.text);
        isWaiting = false;
        document.getElementById('send-btn').disabled = false;
        document.getElementById('user-input').disabled = false;
        document.getElementById('user-input').focus();
      }
    };
    es.onerror = () => {
      setStatus('离线 · 重连中…', false);
      document.getElementById('user-input').disabled = true;
      document.getElementById('send-btn').disabled = true;
      es.close();
      setTimeout(connect, 3000);
    };
  }

  function setStatus(text, online) {
    document.getElementById('conn-status').textContent = text;
    document.getElementById('conn-dot').className = 'header-dot' + (online ? ' online' : '');
  }

  async function sendMessage() {
    const ta = document.getElementById('user-input');
    const text = ta.value.trim();
    if (!text || isWaiting) return;
    ta.value = ''; ta.style.height = 'auto';
    isWaiting = true;
    document.getElementById('send-btn').disabled = true;
    document.getElementById('user-input').disabled = true;
    appendMessage('user', text);
    showTyping();
    try {
      await fetch(`${SERVER}/send`, { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify({ text }) });
    } catch {
      removeTyping();
      appendNotice('发送失败，检查服务器是否在线', true);
      isWaiting = false;
      document.getElementById('send-btn').disabled = false;
      document.getElementById('user-input').disabled = false;
    }
  }

  function appendMessage(role, text) {
    const c = document.getElementById('messages');
    const div = document.createElement('div');
    div.className = `message ${role}`;
    div.innerHTML = `<div class="msg-label">${role === 'user' ? '昭昭' : '笨笨'}</div><div class="msg-bubble">${escHtml(text).replace(/\n/g, '<br>')}</div>`;
    c.appendChild(div); scrollBottom();
  }

  function showTyping() {
    const c = document.getElementById('messages');
    const div = document.createElement('div');
    div.className = 'message assistant'; div.id = 'typing-indicator';
    div.innerHTML = `<div class="msg-label">笨笨</div><div class="typing-bubble"><div class="typing-dot"></div><div class="typing-dot"></div><div class="typing-dot"></div></div>`;
    c.appendChild(div); scrollBottom();
  }

  function removeTyping() { document.getElementById('typing-indicator')?.remove(); }

  function appendNotice(text, isError = false) {
    const c = document.getElementById('messages');
    const div = document.createElement('div');
    div.className = 'conn-notice' + (isError ? ' error' : '');
    div.textContent = text; c.appendChild(div); scrollBottom();
  }

  async function clearChat() {
    if (!confirm('清空这段对话？')) return;
    try { await fetch(`${SERVER}/clear`, { method: 'POST' }); }
    catch { appendNotice('清空失败，检查服务器是否在线', true); return; }
    document.getElementById('messages').innerHTML = '';
  }

  function scrollBottom() { const c = document.getElementById('messages'); setTimeout(() => c.scrollTop = c.scrollHeight, 50); }

  function escHtml(s) { return s.replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;'); }

  const ta = document.getElementById('user-input');
  ta.addEventListener('input', function() { this.style.height = 'auto'; this.style.height = Math.min(this.scrollHeight, 160) + 'px'; });
  ta.addEventListener('keydown', function(e) { if (e.key === 'Enter' && !e.shiftKey) { e.preventDefault(); if (!isWaiting) sendMessage(); } });

  // ── 心情功能 ──────────────────────────────────────────
  const EMOJIS = ['🌸','☀️','🌙','🌧️','☕','🍵','🥹','🥰','🫂','😤','😶','💤'];
  const moodState = { zhaozhao: { emoji: '', text: '' }, bunbun: { emoji: '', text: '' } };

  function getTodayISO() { return new Date().toISOString().slice(0, 10); }

  function getTodayLabel() {
    return new Intl.DateTimeFormat('zh-CN', { month: 'long', day: 'numeric', weekday: 'short' }).format(new Date());
  }

  function renderEmojiPicker(person) {
    const el = document.getElementById(`picker-${person}`);
    if (!el) return;
    el.innerHTML = EMOJIS.map(e =>
      `<button class="emoji-btn${moodState[person].emoji === e ? ' selected' : ''}" onclick="selectEmoji('${person}','${e}')">${e}</button>`
    ).join('');
  }

  function selectEmoji(person, emoji) {
    moodState[person].emoji = moodState[person].emoji === emoji ? '' : emoji;
    renderEmojiPicker(person);
  }

  async function loadMoods() {
    const list = document.getElementById('mood-history-list');
    let entries;
    try {
      const res = await fetch(`${SERVER}/mood`);
      if (!res.ok) throw new Error(`HTTP ${res.status}`);
      entries = await res.json();
      if (!Array.isArray(entries)) throw new Error('invalid response');
    } catch (err) {
      if (list) list.innerHTML = `<div class="mood-empty">加载失败</div>`;
      return;
    }

    const today = getTodayISO();
    const todayEntry = entries.find(e => e.date === today);
    if (todayEntry) {
      if (todayEntry.zhaozhao) { moodState.zhaozhao.emoji = todayEntry.zhaozhao.emoji || ''; moodState.zhaozhao.text = todayEntry.zhaozhao.text || ''; }
      if (todayEntry.bunbun)   { moodState.bunbun.emoji  = todayEntry.bunbun.emoji  || ''; moodState.bunbun.text  = todayEntry.bunbun.text  || ''; }
      renderEmojiPicker('zhaozhao');
      renderEmojiPicker('bunbun');
      const zzEl = document.getElementById('mood-text-zhaozhao');
      const bbEl = document.getElementById('mood-text-bunbun');
      if (zzEl) zzEl.value = moodState.zhaozhao.text;
      if (bbEl) bbEl.value = moodState.bunbun.text;
    }

    if (!list) return;
    if (!entries.length) {
      list.innerHTML = '<div class="mood-empty">还没有记录</div>';
      return;
    }
    list.innerHTML = entries.map(e => {
      const zz = e.zhaozhao || {}, bb = e.bunbun || {};
      const label = e.date === today ? `${e.date} · 今天` : e.date;
      const zzRow = (zz.emoji || zz.text) ? `<div class="mood-history-row"><span class="mood-history-who">昭昭</span><span class="mood-history-emoji">${zz.emoji || ''}</span><span class="mood-history-text">${escHtml(zz.text || '')}</span></div>` : '';
      const bbRow = (bb.emoji || bb.text) ? `<div class="mood-history-row"><span class="mood-history-who">笨笨</span><span class="mood-history-emoji">${bb.emoji || ''}</span><span class="mood-history-text">${escHtml(bb.text || '')}</span></div>` : '';
      return `<div class="mood-history-entry"><div class="mood-history-date">${label}</div>${zzRow}${bbRow}</div>`;
    }).join('');
  }

  async function saveMood() {
    const zzText = document.getElementById('mood-text-zhaozhao')?.value.trim() || '';
    const bbText = document.getElementById('mood-text-bunbun')?.value.trim()   || '';
    moodState.zhaozhao.text = zzText;
    moodState.bunbun.text   = bbText;

    const btn = document.getElementById('mood-save-btn');
    try {
      await fetch(`${SERVER}/mood`, {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ date: getTodayISO(), zhaozhao: { emoji: moodState.zhaozhao.emoji, text: zzText }, bunbun: { emoji: moodState.bunbun.emoji, text: bbText } })
      });
      if (btn) { btn.textContent = '已记录'; btn.classList.add('saved'); setTimeout(() => { btn.textContent = '记录今天的心情'; btn.classList.remove('saved'); }, 2000); }
      await loadMoods();
    } catch {
      if (btn) { btn.textContent = '保存失败'; setTimeout(() => { btn.textContent = '记录今天的心情'; }, 2000); }
    }
  }

  // ── 初始化 ────────────────────────────────────────────
  renderEmojiPicker('zhaozhao');
  renderEmojiPicker('bunbun');
  document.getElementById('mood-today-label').textContent = getTodayLabel();

  loadHistory().then(() => connect());
  loadMoods();
</script>
</body>
</html>
